<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>收藏网页</title>
    <link rel="icon" type="image/png" sizes="16x16" href="icons/cat-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/cat-32.png">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body class="rename-body">
    <main class="rename-panel">
      <form id="rename-form" class="rename-dialog-form">
        <header class="rename-dialog-header">
          <h1 class="rename-dialog-title">
            <span class="bookmark-dialog-icon" aria-hidden="true"></span>
            <span id="rename-heading">收藏网页</span>
          </h1>
          <p id="rename-url" class="rename-dialog-url"></p>
        </header>
        <label class="field">
          <span>名称</span>
          <input id="rename-title" type="text" placeholder="输入便于检索的名称" autocomplete="off" autofocus>
        </label>

        <p id="rename-status" class="rename-status rename-dialog-status" role="alert"></p>

        <div class="rename-dialog-actions">
          <button id="restore-button" class="secondary-button rename-restore" type="button">取消收藏</button>
          <div class="rename-primary-actions">
            <button id="cancel-button" class="secondary-button" type="button">取消</button>
            <button class="primary-button" type="submit">收藏</button>
          </div>
        </div>
      </form>
    </main>

    <script type="module" src="src/rename-page.js"></script>
  </body>
</html>
